<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sales Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #172033;
      background: #f5f7fb;
    }

    header {
      padding: 28px 24px;
      color: white;
      background: linear-gradient(135deg, #111827, #312e81, #7200e8);
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    header p {
      margin: 0;
      color: #e9d5ff;
      font-size: 14px;
    }

    .container {
      width: 100%;
      max-width: 1400px;
      margin: auto;
      padding: 24px;
    }

    .card {
      margin-bottom: 22px;
      padding: 22px;
      border: 1px solid #e4e7ec;
      border-radius: 18px;
      background: white;
      box-shadow: 0 8px 24px rgba(16, 24, 40, 0.05);
    }

    h2 {
      margin: 0 0 8px;
      font-size: 19px;
    }

    .description {
      margin: 0 0 18px;
      color: #667085;
      font-size: 13px;
      line-height: 1.5;
    }

    .system-status {
      margin-bottom: 20px;
      padding: 12px 15px;
      border-radius: 10px;
      color: #344054;
      background: #f2f4f7;
      font-size: 13px;
      font-weight: 700;
    }

    .system-status.success {
      color: #047857;
      background: #d1fae5;
    }

    .system-status.error {
      color: #b91c1c;
      background: #fee2e2;
    }

    .upload-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .upload-box {
      min-height: 170px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      border: 2px dashed #d8b4fe;
      border-radius: 14px;
      background: #fcf8ff;
    }

    .upload-box.loaded {
      border-color: #34d399;
      background: #ecfdf5;
    }

    .upload-box h3 {
      margin: 0 0 7px;
      font-size: 15px;
    }

    .upload-help {
      color: #667085;
      font-size: 12px;
      line-height: 1.4;
    }

    input[type="file"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      background: white;
    }

    .file-status {
      min-height: 18px;
      color: #667085;
      font-size: 12px;
      font-weight: 700;
    }

    .file-status.success {
      color: #047857;
    }

    .actions {
      margin-top: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      min-height: 44px;
      padding: 11px 18px;
      border: none;
      border-radius: 10px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .primary-button {
      color: white;
      background: #7200e8;
    }

    .secondary-button {
      color: #344054;
      background: #eef0f4;
    }

    .message {
      flex: 1;
      min-width: 220px;
      color: #667085;
      font-size: 13px;
    }

    .message.success {
      color: #047857;
      font-weight: 700;
    }

    .message.error {
      color: #b91c1c;
      font-weight: 700;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: minmax(160px, 0.8fr) minmax(190px, 1fr) minmax(240px, 1.6fr) auto;
      gap: 14px;
      align-items: end;
    }

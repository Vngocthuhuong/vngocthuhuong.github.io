<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Sales Dashboard</title>

  <!-- Thư viện đọc file Excel -->

  <style>
    :root {
      --primary: #7200e8;
      --primary-light: #f3e8ff;
      --background: #f5f7fb;
      --text: #172033;
      --muted: #667085;
      --border: #e4e7ec;

      --red: #dc2626;
      --red-light: #fee2e2;

      --orange: #d97706;
      --orange-light: #fef3c7;

      --green: #059669;
      --green-light: #d1fae5;

      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;

      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: var(--background);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* HEADER */

    header {
      padding: 28px;

      color: white;
      background: linear-gradient(
        120deg,
        #14152f,
        #312e81,
        #7200e8
      );
    }

    .header-inner,
    .container {
      width: 100%;
      max-width: 1400px;
      margin: auto;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 34px;
    }

    header p {
      margin: 0;
      color: #e9d5ff;
      font-size: 14px;
    }

    /* GENERAL */

    .container {
      padding: 24px;
    }

    .card {
      margin-bottom: 22px;
      padding: 22px;

      border: 1px solid rgba(228, 231, 236, 0.8);
      border-radius: 18px;

      background: var(--white);

      box-shadow:
        0 8px 24px rgba(16, 24, 40, 0.05);
    }

    h2 {
      margin: 0 0 8px;
      font-size: 19px;
    }

    .description {
      margin: 0 0 18px;

      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    /* UPLOAD */

    .upload-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .upload-box {
      min-height: 155px;
      padding: 18px;

      display: flex;
      flex-direction: column;
      gap: 12px;
      justify-content: space-between;

      border: 2px dashed #d8b4fe;
      border-radius: 14px;

      background: #fcf8ff;
    }

    .upload-box.loaded {
      border-color: #34d399;
      background: #ecfdf5;
    }

    .upload-box h3 {
      margin: 0 0 7px;
      font-size: 15px;
    }
